<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" width="160" height="120">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
  </defs>
  <!-- Thermometer Device Body -->
  <rect x="6" y="6" width="148" height="108" rx="14" fill="url(#bgGrad)" stroke="#334155" stroke-width="2"/>
  
  <!-- Digital Screen -->
  <rect x="18" y="18" width="124" height="64" rx="8" fill="#0b1329" stroke="#1e293b" stroke-width="1.5"/>
  
  <!-- Screen Glow / Display Header -->
  <text x="26" y="32" font-size="7" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="700" fill="#38bdf8" letter-spacing="1">CHILLED STORAGE TEMP</text>
  <circle cx="132" cy="29" r="3" fill="#22c55e"/>

  <!-- Temperature Value -->
  <text x="32" y="66" font-size="32" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="900" fill="#f8fafc">4.2</text>
  <text x="88" y="52" font-size="16" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="700" fill="#38bdf8">°C</text>
  <text x="88" y="70" font-size="8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="600" fill="#94a3b8">PROBE IN</text>

  <!-- Status Bar / Specs -->
  <rect x="18" y="90" width="124" height="20" rx="5" fill="#1e293b"/>
  <text x="28" y="103" font-size="7.5" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="600" fill="#22c55e">✓ SPEC: 2°C – 4°C</text>
  <text x="132" y="103" font-size="7.5" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="600" fill="#94a3b8" text-anchor="end">QA VERIFIED</text>
</svg>
